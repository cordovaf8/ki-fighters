<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jin · Subtle aura preview</title>
<style>
  *{box-sizing:border-box} body{margin:0;background:#101722;color:#e4ebf5;font:16px system-ui;min-height:100vh;display:grid;place-content:center;padding:24px}
  main{width:min(900px,94vw)} h1{font-size:22px;margin:0 0 5px}p{color:#a9b8cc;margin:0 0 18px}
  .stage{position:relative;aspect-ratio:3/2;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 50% 65%,#1d3040,#101722 68%)}
  .stage img{position:absolute;width:100%;height:100%;object-fit:contain;pointer-events:none}
  .aura{transform-origin:50% 95%;mix-blend-mode:screen;animation:breathe 1.25s ease-in-out infinite alternate,flicker .17s steps(2,end) infinite;opacity:.2}
  .fighter{z-index:2}canvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
  @keyframes breathe{from{transform:translateY(2px) scale(.95,.98)}to{transform:translateY(-3px) scale(1.015,1.025)}}
  @keyframes flicker{0%,100%{opacity:.15}50%{opacity:.23}}
  footer{display:flex;gap:20px;align-items:center;margin-top:16px;color:#a9b8cc}button{background:#24384e;color:white;border:1px solid #48627e;border-radius:8px;padding:8px 16px;cursor:pointer}
  label{display:flex;align-items:center;gap:8px}.paused .aura{animation-play-state:paused}
</style>
<main><h1>Jin · Armored transformation</h1><p>A restrained cyan aura with upward motion, gentle pulsing, and occasional sparks.</p>
<div class="stage" id="stage"><img class="aura" src="aura-subtle-layer.png" alt=""><img class="fighter" src="transformation-armor-01.png" alt="Jin in alien armor"><canvas width="900" height="600"></canvas></div>
<footer><button id="pause">Pause animation</button><label>Aura strength <input type="range" min="0" max="100" value="30" id="strength"></label></footer></main>
<script>
const stage=document.querySelector('.stage'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let paused=false,clock=0,last=0,strength=.3;
document.querySelector('#pause').onclick=()=>{paused=!paused;stage.classList.toggle('paused',paused);document.querySelector('#pause').textContent=paused?'Play animation':'Pause animation'};
document.querySelector('#strength').oninput=e=>{strength=e.target.value/100;stage.querySelector('.aura').style.filter=`opacity(${strength/.3})`};
function paint(t){ctx.clearRect(0,0,900,600);ctx.globalCompositeOperation='lighter';
  // Small independent flecks rise and fade; they are not baked into the fighter.
  for(let i=0;i<14;i++){
    const phase=(t/1700+i*.618)%1,side=i%2?-1:1;
    const x=450+side*(180+Math.sin(i*2.1+phase*5)*45),y=570-phase*470;
    ctx.globalAlpha=Math.sin(phase*Math.PI)*.38*strength/.3;
    ctx.fillStyle=i%3?'#6fe6ff':'#cfF9ff';ctx.fillRect(x,y,2,4);
  }
  ctx.globalAlpha=1;
  for(let i=0;i<2;i++){
    const phase=(t+i*1100)%2700;
    if(phase>110)continue;
    const x=i?644:260,y=i?320:438;
    ctx.globalAlpha=(1-phase/110)*.55*strength/.3;ctx.strokeStyle='#91eaff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+7,y-10);ctx.lineTo(x+2,y-14);ctx.lineTo(x+10,y-25);ctx.stroke();
  }
}
function loop(t){if(!paused)clock+=last?Math.min(t-last,40):0;last=t;paint(clock);requestAnimationFrame(loop)}requestAnimationFrame(loop);
// Deterministic pose time for recording previews.
window.previewAt=t=>{paused=true;stage.classList.add('paused');stage.querySelector('.aura').getAnimations().forEach(a=>a.currentTime=t);clock=t;paint(t)};
</script>
</html>
